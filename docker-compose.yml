# Full stack for the Team Task Tracker API.
#
#   docker compose up            -> postgres + redis + api (zero manual setup)
#   docker compose up -d postgres redis  -> data stores only, for host dev
#                                           (`cd backend && npm run start:dev`)
#
# Inside the network, services reach each other by name on their internal ports
# (postgres:5432, redis:6379). Host ports are remapped to avoid local clashes.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tasktracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: task_tracker
    # Host port 5433 (not 5432) to avoid clashing with a local Postgres install.
    # Container-internal port stays 5432, so the in-Docker `api` service is unaffected.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The API container waits on this healthcheck so migrations never race a
    # database that isn't accepting connections yet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d task_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tasktracker_redis
    restart: unless-stopped
    # Host port 6380 to avoid clashing with a local Redis install (container stays 6379).
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tasktracker_api
    restart: unless-stopped
    # Wait for both stores to be healthy so migrations and cache work on boot.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Connect to the other services by name on their internal ports.
      DATABASE_URL: postgresql://taskuser:taskpass@postgres:5432/task_tracker?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      JWT_REFRESH_TTL: 7d
      PORT: 3000
      TASK_CACHE_TTL: 60
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
